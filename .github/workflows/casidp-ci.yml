name: CAS-IDP Fork CI

on:
  push:
    branches:
      - casidp/issuance-generation-fence-8.0.1
  pull_request:
    branches:
      - casidp/issuance-generation-fence-8.0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casidp-fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full source and release-graph verification
    if: ${{ github.repository == 'SoooEZ/cas' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download the exact Amazon Corretto 25.0.4.7.1 archive
        env:
          CORRETTO_SHA256: 1d03a3bd5091728492d92f0ef341aca7d8885ece9a150119558f3e3d62b58745
          CORRETTO_URL: https://corretto.aws/downloads/resources/25.0.4.7.1/amazon-corretto-25.0.4.7.1-linux-x64.tar.gz
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/amazon-corretto-25.0.4.7.1-linux-x64.tar.gz"
          curl \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --fail \
            --show-error \
            --silent \
            --location \
            --max-redirs 3 \
            --output "${archive}" \
            "${CORRETTO_URL}"
          printf '%s  %s\n' "${CORRETTO_SHA256}" "${archive}" | sha256sum --check -

      - name: Set up the checksum-pinned JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: jdkfile
          java-version: '25.0.4+7'
          architecture: x64
          jdkFile: ${{ runner.temp }}/amazon-corretto-25.0.4.7.1-linux-x64.tar.gz

      - name: Verify the exact Java runtime
        run: |
          set -Eeuo pipefail
          java_version=$(java -version 2>&1)
          grep -Fq 'openjdk version "25.0.4"' <<< "${java_version}"
          grep -Fq 'Corretto-25.0.4.7.1' <<< "${java_version}"

      - name: Set up Gradle with a read-only dependency cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Verify release tooling and workflow syntax
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only \
            --volume "$PWD:/mnt:ro" \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            ci/casidp-release.sh ci/casidp-update-locks.sh
          docker run --rm --network none --read-only \
            --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            .github/workflows/casidp-ci.yml .github/workflows/casidp-release.yml
          python3 -m unittest ci/test_casidp_supply_chain.py

      - name: Build and audit the fork source
        env:
          JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
        run: ./ci/casidp-release.sh --ci

      - name: Preserve CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: casidp-fork-ci-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
          path: |
            .casidp-release/publish-task-graph.json
            .casidp-release/publish-task-graph.log
            build/reports/cyclonedx/bom.json
            **/build/test-results/**/*.xml
