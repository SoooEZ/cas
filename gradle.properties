############################
# Gradle settings
############################
org.gradle.daemon.idletimeout=3600000
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xms1024m -Xmx16g \
  -XX:+EnableDynamicAgentLoading -XX:SoftRefLRUPolicyMSPerMB=0 \
  -XX:ReservedCodeCacheSize=128m -XX:TieredStopAtLevel=1 \
  --add-opens java.base/java.io=ALL-UNNAMED
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.isolated-projects=true
org.gradle.configuration-cache.parallel=true

org.gradle.internal.network.retry.maxRetries=5
org.gradle.internal.network.retry.retryInitialInterval=1000
org.gradle.internal.network.retry.retryMaxInterval=10000
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
