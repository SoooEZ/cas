import org.gradle.external.javadoc.JavadocMemberLevel
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JvmVendorSpec
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.apereo.cas.gradle.CasBuildSettings

plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'jacoco'
}

jacoco {
    toolVersion = "${libs.versions.jacoco.get()}"
}

if (gradle.startParameter.taskNames.any { task -> task.contains('publishToMavenLocal') }) {
    project.pluginManager.apply('maven-publish')
}

project.pluginManager.apply('org.apereo.cas.tasks-conventions')

CasBuildSettings.configureProjectExtensions(project)

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

if (!CasBuildSettings.isArchAdjusted()) {
    def arch = System.getProperty('os.arch')
    if (arch == 'aarch64') {
        System.setProperty('os.arch', 'x86_64')
        arch = System.getProperty('os.arch')
        def name = System.getProperty('os.name')
        logger.info("The OS platform architecture for this Gradle build is reset to ${arch} for ${name}")
    }
    CasBuildSettings.markArchAdjusted()
}

project.ext['forceBootifulArtifact'] = null

if (generateGitProperties) {
    project.pluginManager.apply('io.hndrs.git-properties')
    tasks.named('generateGitProperties') {
        def propertiesFile = project.layout.buildDirectory.file('resources/main/git.properties').get().asFile
        def projectGroup = CasBuildSettings.projectGroup(project)
        def projectName = project.name
        def projectVersion = CasBuildSettings.projectVersion(project)
        def projectDescription = project.description
        def upstreamVersion = providers.gradleProperty('casIdpUpstreamVersion').get()
        def upstreamCommit = providers.gradleProperty('casIdpUpstreamCommit').get()
        def forkRepository = providers.gradleProperty('casIdpForkRepository').get()

        it.dotGitDirectory.set(new File(project.rootDir, '.git'))
        it.output.set(propertiesFile)
        inputs.property('casIdpUpstreamVersion', upstreamVersion)
        inputs.property('casIdpUpstreamCommit', upstreamCommit)
        inputs.property('casIdpForkRepository', forkRepository)
        doLast {
            def allowedGitPrefixes = [
                'git.commit.id=',
                'git.commit.id.abbrev=',
                'git.commit.signed=',
                'git.commit.time='
            ]
            def deterministicProperties = propertiesFile.readLines('UTF-8')
                .findAll { line -> allowedGitPrefixes.any { prefix -> line.startsWith(prefix) } }
            deterministicProperties.addAll([
                "cas-idp.fork.repository=${forkRepository}",
                "cas-idp.upstream.commit=${upstreamCommit}",
                "cas-idp.upstream.version=${upstreamVersion}",
                "project.description=${projectDescription}",
                "project.group=${projectGroup}",
                "project.name=${projectName}",
                "project.version=${projectVersion}"
            ])
            propertiesFile.setText(deterministicProperties.sort().join('\n') + '\n', 'UTF-8')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.targetCompatibility.toString()))
        if (!ci) {
            vendor = JvmVendorSpec.JETBRAINS
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = false
        jdkName = project.targetCompatibility
        excludeDirs += file('.gradle')
        ['.settings', 'classes', 'bin', 'out', 'docs', 'dependency-cache', 'libs',
         'reports', 'resources', 'test-results', 'tmp', 'gh-pages'].each {
            excludeDirs += project.layout.buildDirectory.files(it)
        }
    }
}

tasks.named('javadoc') {
    options.memberLevel = JavadocMemberLevel.PUBLIC
    options.addBooleanOption('html5', true)
    options.addStringOption('Xdoclint:html,reference,syntax', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    failOnError = providers.systemProperty('ignoreJavadocFailures').present
    excludes = ['**/generated/**', '**/com/duosecurity/**']
}

